  <style>
    body {
      margin: 0;
      padding: 0;
      background: #FAFBFC;
      overflow-x: hidden;
    }
    .loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAFBFC;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    .loading-splash.hide { opacity: 0; pointer-events: none; }
    .splash-logo {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563EB, #38BDF8, #8B5CF6);
      animation: pulse 1.6s ease-in-out infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: 22px;
      box-shadow: 0 20px 60px rgba(37, 99, 235, 0.35);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
  </style>

<body>
  <div class="loading-splash" id="splash">

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.classList.add('hide'); setTimeout(function(){ s.remove(); }, 700); }
    });
  </script>
